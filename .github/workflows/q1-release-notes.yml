jobs:
   build:
     runs-on: ${{ matrix.os }}
     timeout-minutes: 10
     strategy:
       fail-fast: false
       matrix:
           os: ubuntu-22.04
           node: 18
     steps:
       -uses: actions/checkout@04
       -uses: actions/setup-node@v4
     with:
      node-version: ${{ matrix.node }}

      -name: Print Versions
      run: |
        node -v
        npm -v
    -name: write Report
    run: |
       mkdir -p out
